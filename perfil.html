<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil — ProFrio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .profile-header { display: flex; align-items: center; gap: 2rem; margin-bottom: 2rem; }
    .avatar-large { width: 100px; height: 100px; border-radius: 50%; background: var(--primary-600); color: white; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; }
    .filters { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    
    @media (max-width: 768px) {
      .profile-header { flex-direction: column; text-align: center; gap: 1rem; }
      .filters { flex-direction: column; width: 100%; gap: 0.5rem; }
      .filters button { width: 100%; }
      .card > .flex { flex-direction: column; gap: 1rem; }
      .flex.justify-between.items-center.mb-4 { flex-direction: column; align-items: stretch; gap: 1rem; }
      #search-input { width: 100% !important; }
      .flex.gap-2 { width: 100%; }
    }
  </style>
</head>
<body>

  <main class="container" style="padding-top: 2rem;">
    <div class="flex justify-between items-center mb-6">
      <button id="btn-back" class="btn btn-secondary">← Volver</button>
      <button id="btn-logout" class="btn btn-danger">Cerrar Sesión</button>
    </div>

    <div class="card mb-6">
      <div class="profile-header">
        <div id="avatar-initials" class="avatar-large">U</div>
        <div>
          <h1 id="profile-name" style="font-size: 2rem;">Usuario</h1>
          <p id="profile-email" style="color: var(--gray-600); margin-bottom: 0.5rem;">email@ejemplo.com</p>
          <span id="profile-role" class="badge badge-online">Empleado</span>
        </div>
      </div>
      <div class="flex gap-4">
        <div class="card" style="flex:1; background: var(--off-white); box-shadow:none; border:1px solid var(--gray-200);">
          <h3 style="font-size:0.9rem; color:var(--gray-600);">Intervenciones</h3>
          <p id="stat-intervencion" style="font-size:2rem; font-weight:800; color:var(--primary-600);">0</p>
        </div>
        <div class="card" style="flex:1; background: var(--off-white); box-shadow:none; border:1px solid var(--gray-200);">
          <h3 style="font-size:0.9rem; color:var(--gray-600);">Materiales</h3>
          <p id="stat-materiales" style="font-size:2rem; font-weight:800; color:var(--primary-600);">0</p>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="mb-4">Mis Formularios</h2>
      <div class="flex justify-between items-center mb-4">
        <div class="filters">
          <button id="filter-all" class="btn btn-primary" style="padding: 0.5rem 1rem;">Todos</button>
          <button id="filter-intervencion" class="btn btn-secondary" style="padding: 0.5rem 1rem;">Intervenciones</button>
          <button id="filter-materiales" class="btn btn-secondary" style="padding: 0.5rem 1rem;">Materiales</button>
        </div>
        <div class="flex gap-2">
          <input type="text" id="search-input" class="form-input" placeholder="Buscar cliente o número..." style="width:250px;">
          <button id="btn-search" class="btn btn-secondary">🔍</button>
        </div>
      </div>
      
      <div id="forms-loading" style="text-align:center; padding: 2rem;">
        <div class="spinner" style="margin: 0 auto;"></div>
      </div>
      <div id="forms-list" class="flex-col gap-2">
        <!-- JS fills this -->
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/online-status.js"></script>
  <script src="js/perfil.js"></script>
  <script>
    document.getElementById('btn-back').addEventListener('click', () => { window.history.back(); });
  </script>
</body>
</html>
