<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil — ProFrio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css?v=9">
  <link rel="stylesheet" href="css/dashboard.css?v=9">
  <style>
    .profile-header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; }
    .avatar-large { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-600), var(--primary-400)); color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; flex-shrink: 0; box-shadow: var(--shadow-md); }
    
    /* Stats */
    .stats-row { display: flex; gap: 1rem; margin-top: 1rem; }
    .stat-card { flex: 1; background: var(--off-white); border-radius: var(--radius-md); padding: 1rem; border: 1px solid var(--gray-200); text-align: center; }
    .stat-card h3 { font-size: 0.8rem; color: var(--gray-600); font-weight: 600; margin-bottom: 0.25rem; }
    .stat-card p { font-size: 2rem; font-weight: 800; color: var(--primary-600); margin: 0; line-height: 1; }

    /* Forms section */
    .forms-toolbar { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem; }
    .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-row .btn { flex: 1; min-width: 0; font-size: 0.85rem; padding: 0.5rem 0.75rem; white-space: nowrap; }
    .search-row { display: flex; gap: 0.5rem; }
    .search-row input { flex: 1; min-width: 0; }
    .search-row .btn { flex-shrink: 0; }

    /* Form list items */
    .form-item { display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 0; border-bottom: 1px solid var(--gray-100); gap: 0.75rem; }
    .form-item:last-child { border-bottom: none; }
    .form-item-info { flex: 1; min-width: 0; }
    .form-item-info strong { display: block; font-size: 0.9rem; color: var(--primary-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .form-item-info small { color: var(--gray-600); font-size: 0.8rem; }
    .badge-tipo { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 99px; font-size: 0.7rem; font-weight: 700; margin-left: 0.4rem; vertical-align: middle; }
    .badge-tipo.intervencion { background: var(--primary-50); color: var(--primary-700); }
    .badge-tipo.materiales { background: #f0fdf4; color: #15803d; }

    @media (max-width: 480px) {
      main.container { padding: 0.75rem; }
      .profile-header { flex-direction: column; text-align: center; }
      .avatar-large { margin: 0 auto; }
    }
  </style>
</head>
<body>

  <main class="container" style="padding-top: 2rem;">
    <div class="flex justify-between items-center mb-6">
      <button id="btn-back" class="btn btn-secondary">← Volver</button>
      <button id="btn-logout" class="btn btn-danger">Cerrar Sesión</button>
    </div>

    <div class="card mb-6">
      <div class="profile-header">
        <div id="avatar-initials" class="avatar-large">U</div>
        <div>
          <h1 id="profile-name" style="font-size: 2rem;">Usuario</h1>
          <p id="profile-email" style="color: var(--gray-600); margin-bottom: 0.5rem;">email@ejemplo.com</p>
          <span id="profile-role" class="badge badge-online">Empleado</span>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <h3>Intervenciones</h3>
          <p id="stat-intervencion">0</p>
        </div>
        <div class="stat-card">
          <h3>Materiales</h3>
          <p id="stat-materiales">0</p>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-bottom:1rem;">Mis Formularios</h2>
      <div class="forms-toolbar">
        <div class="filter-row">
          <button id="filter-all" class="btn btn-primary">Todos</button>
          <button id="filter-intervencion" class="btn btn-secondary">Intervenciones</button>
          <button id="filter-materiales" class="btn btn-secondary">Materiales</button>
        </div>
        <div class="search-row">
          <input type="text" id="search-input" class="form-input" placeholder="Buscar cliente o número...">
          <button id="btn-search" class="btn btn-secondary">🔍</button>
        </div>
      </div>
      
      <div id="forms-loading" style="text-align:center; padding: 2rem;">
        <div class="spinner" style="margin: 0 auto;"></div>
      </div>
      <div id="forms-list">
        <!-- JS fills this -->
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=9"></script>
  <script src="js/auth.js?v=9"></script>
  <script src="js/online-status.js?v=9"></script>
  <script src="js/perfil.js?v=9"></script>
  <script>
    document.getElementById('btn-back').addEventListener('click', () => { window.history.back(); });
  </script>
</body>
</html>
