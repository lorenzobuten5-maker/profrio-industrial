<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Mi perfil en ProFrio Industrial — historial de formularios y estadísticas personales.">
  <title>Mi Perfil — ProFrio Industrial</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="js/biometric-auth.js?v=27"></script>
  <script src="js/fuzzy-search.js?v=27"></script>
  <style>
    body { display: block; min-height: 100vh; }

    .perfil-page {
      min-height: 100vh;
      background: linear-gradient(160deg, var(--off-white) 0%, #EBF2FF 100%);
      padding: clamp(1rem, 4vw, 2.5rem);
      padding-bottom: calc(clamp(1rem, 4vw, 2.5rem) + 88px + env(safe-area-inset-bottom, 0px));
    }

    /* ── Topbar ── */
    .perfil-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      gap: 0.75rem;
    }

    /* ── Profile card ── */
    .profile-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: clamp(1.75rem, 5vw, 2.75rem);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--gray-100);
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.35s ease both;
    }
    .profile-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--primary-700), var(--accent));
    }
    .profile-card::after {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(0,212,255,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      flex-wrap: wrap;
    }

    .avatar-large {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: var(--grad-primary);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; font-weight: 800;
      flex-shrink: 0;
      box-shadow: var(--shadow-color);
      border: 4px solid white;
      position: relative;
      z-index: 1;
    }

    .profile-info { position: relative; z-index: 1; }
    .profile-info h1 {
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 800;
      color: var(--primary-900);
      margin-bottom: 0.25rem;
      letter-spacing: -0.04em;
    }
    .profile-info p { color: var(--gray-500); font-size: 0.9rem; margin-bottom: 0.6rem; }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem;
      margin-top: 1.75rem;
    }
    .stat-card {
      background: linear-gradient(135deg, var(--clay-blue-50, #EFF6FF), #FFFFFF);
      border-radius: var(--radius-lg);
      padding: 1rem 0.85rem;
      border: 2px solid var(--clay-blue-100, #DBEAFE);
      text-align: center;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 4px 6px 16px rgba(37,99,235,0.08), -2px -2px 8px rgba(255,255,255,0.9);
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--clay-blue-800), var(--clay-blue-500));
    }
    .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .stat-card h3 {
      font-size: 0.67rem;
      color: var(--gray-500);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-card p {
      font-size: 2.2rem; font-weight: 800;
      color: var(--clay-blue-600);
      margin: 0; line-height: 1;
      letter-spacing: -0.04em;
    }

    /* ── Forms section ── */
    .forms-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: clamp(1.5rem, 4vw, 2.25rem);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-100);
      animation: fadeInUp 0.45s ease 0.1s both;
    }
    .forms-card h2 {
      font-size: 1.1rem; font-weight: 700;
      color: var(--primary-900); margin-bottom: 1.25rem;
    }

    .forms-toolbar {
      display: flex; flex-direction: column;
      gap: 0.85rem; margin-bottom: 1.25rem;
    }
    .filter-row {
      display: flex; gap: 0.5rem;
      overflow-x: auto; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-row .btn {
      flex-shrink: 0; font-size: 0.83rem;
      padding: 0.45rem 0.95rem; border-radius: var(--radius-full);
      font-weight: 600; transition: all 0.2s;
    }
    .filter-row .btn.active, .filter-row .btn-primary {
      background: var(--grad-primary); color: white;
      box-shadow: var(--shadow-color);
    }
    .filter-row .btn-secondary {
      background: var(--gray-100); color: var(--gray-600);
      border: 1px solid var(--gray-200);
    }
    .filter-row .btn-secondary:hover { background: var(--primary-50); color: var(--primary-600); }
    .search-row { display: flex; gap: 0.5rem; }
    .search-row input { flex: 1; min-width: 0; font-size: 0.9rem; }
    .search-row .btn { flex-shrink: 0; }

    /* Form items list */
    .form-item {
      display: flex; justify-content: space-between;
      align-items: center; padding: 0.9rem 0.75rem;
      border-radius: var(--radius-sm);
      border-bottom: 1px solid var(--gray-100);
      gap: 0.75rem; transition: background 0.15s;
    }
    .form-item:last-child { border-bottom: none; }
    .form-item:hover { background: var(--primary-50); }
    .form-item-info { flex: 1; min-width: 0; }
    .form-item-info strong {
      display: block; font-size: 0.9rem;
      color: var(--primary-900); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.15rem;
    }
    .form-item-info small { color: var(--gray-500); font-size: 0.78rem; }
    .badge-tipo {
      display: inline-flex; align-items: center;
      padding: 0.15rem 0.55rem; border-radius: var(--radius-full);
      font-size: 0.68rem; font-weight: 700;
      margin-left: 0.35rem; vertical-align: middle; flex-shrink: 0;
    }
    .badge-tipo.intervencion { background: var(--primary-50); color: var(--primary-600); }
    .badge-tipo.materiales   { background: #f0fdf4; color: #15803d; }

    .empty-state { text-align: center; padding: 3.5rem 1.5rem; color: var(--gray-400); }
    .empty-state .empty-icon { font-size: 3.5rem; margin-bottom: 0.85rem; opacity: 0.4; }
    .empty-state p { font-size: 0.9rem; }

    @media (max-width: 479px) {
      .perfil-topbar { margin-bottom: 1rem; }
      .profile-header { flex-direction: column; text-align: center; }
      .avatar-large { margin: 0 auto; }
      .profile-info h1 { font-size: 1.4rem; }
      .stats-row { gap: 0.65rem; }
      .stat-card p { font-size: 1.8rem; }
      .form-item { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div class="perfil-page">
    <!-- Topbar -->
    <div class="perfil-topbar">
      <button id="btn-back" class="btn btn-secondary">← Volver</button>
      <button id="btn-logout" class="btn btn-danger">Cerrar Sesión</button>
    </div>

    <!-- Profile Card -->
    <div class="profile-card">
      <div class="profile-header">
        <div id="avatar-initials" class="avatar-large">U</div>
        <div class="profile-info">
          <h1 id="profile-name">Usuario</h1>
          <p id="profile-email">email@ejemplo.com</p>
          <span id="profile-role" class="badge badge-online">Empleado</span>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <h3>Intervenciones</h3>
          <p id="stat-intervencion">0</p>
        </div>
        <div class="stat-card">
          <h3>Materiales</h3>
          <p id="stat-materiales">0</p>
        </div>
      </div>
    </div>

    <!-- Forms Card -->
    <div class="forms-card">
      <h2>📋 Mis Formularios</h2>
      <div class="forms-toolbar">
        <div class="filter-row">
          <button id="filter-all" class="btn btn-primary">Todos</button>
          <button id="filter-intervencion" class="btn btn-secondary">Intervenciones</button>
          <button id="filter-materiales" class="btn btn-secondary">Materiales</button>
        </div>
        <div class="search-row">
          <input type="text" id="search-input" class="form-input" placeholder="Buscar cliente o número…">
          <button id="btn-search" class="btn btn-secondary">🔍</button>
        </div>
      </div>

      <div id="forms-loading" style="text-align:center; padding:2.5rem;">
        <div class="spinner" style="margin:0 auto;"></div>
      </div>
      <div id="forms-list"></div>
    </div>
  </div>
