<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Historial completo de reportes de intervención y solicitudes de materiales de ProFrio Industrial.">
  <title>Historial de Formularios — ProFrio Industrial</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css?v=25">
  <link rel="stylesheet" href="css/dashboard.css?v=25">
  <script src="js/utils.js?v=25"></script>
  <script src="js/offline-sync.js?v=25"></script>
  <script src="js/biometric-auth.js?v=25"></script>
  <script src="js/fuzzy-search.js?v=25"></script>
  <style>
    html, body { overflow-x: hidden; max-width: 100vw; }

    .toolbar-box {
      background: rgba(255,255,255,0.85);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      box-shadow: var(--clay-shadow-white);
      margin-bottom: 1.5rem;
      border: 2px solid rgba(255,255,255,0.9);
      display: flex; flex-direction: column; gap: 1rem;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .toolbar-row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .toolbar-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 0.4rem; }
    .toolbar-group label { font-size: 0.78rem; font-weight: 700; color: var(--clay-blue-800); letter-spacing: 0.04em; text-transform: uppercase; }

    .filter-pills { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-pill {
      background: rgba(255,255,255,0.8);
      border: 2px solid var(--clay-blue-200);
      color: var(--clay-blue-600);
      padding: 0.45rem 1rem;
      font-size: 0.84rem; font-weight: 700;
      border-radius: var(--radius-full);
      cursor: pointer; transition: all 0.22s ease; font-family: inherit;
      box-shadow: 4px 4px 10px rgba(37,99,235,0.1), -2px -2px 8px rgba(255,255,255,0.9);
    }
    .filter-pill.active {
      background: linear-gradient(135deg, var(--clay-blue-800), var(--clay-blue-600));
      color: #fff; border-color: transparent;
      box-shadow: 6px 8px 18px rgba(37,99,235,0.35), inset -3px -3px 6px rgba(30,58,138,0.4), inset 3px 3px 6px rgba(255,255,255,0.25);
    }
    .filter-pill:hover:not(.active) { background: var(--clay-blue-50); border-color: var(--clay-blue-300); transform: translateY(-2px); }

    .history-list { display: flex; flex-direction: column; gap: 1rem; }
    .history-card {
      background: rgba(255,255,255,0.9);
      border-radius: var(--radius-xl);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--clay-shadow-white);
      border: 2px solid rgba(255,255,255,0.95);
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      transition: all 0.28s cubic-bezier(.4,0,.2,1);
      animation: fadeInUp 0.35s ease both;
    }
    .history-card:hover { transform: translateY(-4px) scale(1.01); box-shadow: var(--shadow-lg); border-color: var(--clay-blue-200); }
    .card-main-info { flex: 1; min-width: 0; }
    .card-title-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.35rem; flex-wrap: wrap; }
    .card-title-row strong { font-size: 1rem; color: var(--clay-blue-900); font-weight: 800; }
    .badge-tipo {
      font-size: 0.7rem; font-weight: 700;
      padding: 0.2rem 0.65rem; border-radius: var(--radius-full);
      display: inline-flex; align-items: center;
      box-shadow: 3px 3px 8px rgba(37,99,235,0.12), -2px -2px 6px rgba(255,255,255,0.9);
    }
    .badge-tipo.intervencion { background: var(--clay-blue-100); color: var(--clay-blue-700); border: 1.5px solid var(--clay-blue-200); }
    .badge-tipo.materiales   { background: var(--clay-mint-bg);    color: var(--clay-mint-dark);   border: 1.5px solid rgba(18,183,106,0.25); }
    .card-meta-row  { display: flex; gap: 1rem; color: var(--gray-500); font-size: 0.84rem; flex-wrap: wrap; align-items: center; }
    .meta-item      { display: flex; align-items: center; gap: 0.3rem; }
    .card-right-info{ text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; flex-shrink: 0; }
    .card-total     { font-size: 1.2rem; font-weight: 800; color: var(--clay-blue-600); }

    .admin-banner {
      background: var(--clay-blue-100); border: 2px solid var(--clay-blue-200);
      color: var(--clay-blue-800); padding: 0.75rem 1rem;
      border-radius: var(--radius-lg); font-size: 0.82rem;
      margin-bottom: 1.25rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.5rem;
      box-shadow: 4px 6px 16px rgba(37,99,235,0.08), -2px -2px 8px rgba(255,255,255,0.9);
      line-height: 1.35;
    }

    @media (max-width: 768px) {
      .history-card { flex-direction: column; align-items: stretch; padding: 1.25rem; }
      .card-right-info { text-align: left; align-items: flex-start; border-top: 2px solid var(--clay-purple-100); padding-top: 0.75rem; margin-top: 0.5rem; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header"><span>❄️</span> ProFrio</div>
    <nav class="sidebar-nav">
      <a href="#" id="sidebar-dash-link">🏠 Panel Principal</a>
      <a href="historial-formularios.html" class="active">📂 Historial</a>
    </nav>
    <div class="sidebar-footer">
      <button id="btn-logout" class="btn btn-outline w-full">Cerrar Sesión</button>
    </div>
  </aside>

  <main class="main-wrapper">
    <header class="top-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <button id="btn-toggle-sidebar" class="sidebar-toggle-btn">☰</button>
        <div class="page-title" style="margin:0;">📂 Historial de Formularios</div>
      </div>
      <div class="user-info">
        <span id="header-user-name" class="user-name">Usuario</span>
        <div class="user-avatar" id="header-user-avatar">👷</div>
      </div>
    </header>

    <div class="content-area">
      <div id="admin-banner-view" class="admin-banner" style="display:none;">
        🛡️ <strong>Modo Administrador</strong> — Acceso a formularios de todos los empleados.
      </div>

      <div class="toolbar-box">
        <div class="toolbar-row">
          <div class="toolbar-group">
            <label>Buscar</label>
            <input type="text" id="search-input" class="form-input" placeholder="Cliente, número, técnico...">
          </div>
          <div class="toolbar-group">
            <label>Tipo</label>
            <div class="filter-pills">
              <button id="pill-all" class="filter-pill active">Todos</button>
              <button id="pill-intervencion" class="filter-pill">🔧 Intervención</button>
              <button id="pill-materiales" class="filter-pill">📦 Materiales</button>
            </div>
          </div>
        </div>
        <div class="toolbar-row">
          <div class="toolbar-group">
            <label>Técnico</label>
            <select id="filter-tecnico" class="form-input">
              <option value="">Todos los técnicos</option>
            </select>
          </div>
          <div class="toolbar-group">
            <label>Estado</label>
            <select id="filter-status" class="form-input">
              <option value="">Todos los estados</option>
              <option value="completo">Completo</option>
              <option value="pendiente">Pendiente</option>
            </select>
          </div>
          <div class="toolbar-group">
            <label>Fecha inicial</label>
            <input type="date" id="filter-date-start" class="form-input">
          </div>
          <div class="toolbar-group">
            <label>Fecha final</label>
            <input type="date" id="filter-date-end" class="form-input">
          </div>
        </div>
      </div>

      <div id="loading-spinner" style="text-align:center; padding:4rem 0;">
        <div class="spinner" style="margin: 0 auto;"></div>
      </div>

      <div id="empty-state" style="display:none; text-align:center; padding:5rem 1rem; color:var(--gray-500);">
        <div style="font-size:3.5rem; margin-bottom:1rem; opacity:0.35; filter:drop-shadow(0 4px 8px rgba(110,86,207,0.2));">📂</div>
        <h3 style="font-size:1.2rem; margin-bottom:0.5rem; color:var(--clay-purple-800);">No se encontraron formularios</h3>
        <p style="font-size:0.9rem;">Cambia los parámetros de búsqueda o filtros.</p>
      </div>

      <div id="history-list-container" class="history-list" style="display:none;"></div>
    </div>
  </main>

  <!-- ══ BOTTOM NAV (MOBILE) ══ -->
  <nav class="bottom-nav" role="navigation" aria-label="Navegación principal">

      <div class="nav-icon-wrap">🏠</div>
      <span class="nav-label">Inicio</span>

    <a href="formulario-intervencion.html" class="nav-item">
      <div class="nav-icon-wrap">📋</div>
      <span class="nav-label">Intervención</span>
    </a>
    <a href="formulario-materiales.html" class="nav-item">
      <div class="nav-icon-wrap">📦</div>
      <span class="nav-label">Materiales</span>
    </a>
    <a href="historial-formularios.html" class="nav-item active">
      <div class="nav-icon-wrap">📂</div>
      <span class="nav-label">Historial</span>
    </a>
    <a href="perfil.html" class="nav-item">
      <div class="nav-icon-wrap">👤</div>
      <span class="nav-label">Perfil</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/security.js?v=25"></script>
  <script src="js/supabase-config.js?v=25"></script>
  <script src="js/auth.js?v=25"></script>
  <script src="js/nav-router.js?v=25"></script>
  <script src="js/online-status.js?v=25"></script>
  <script src="js/historial-formularios.js?v=25"></script>
  <button id="scroll-to-top-btn" aria-label="Volver arriba" title="Volver arriba">↑</button>
</body>
</html>
